name: check
on:
  pull_request:
  push:
    branches: [master]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check.py
      - name: JavaScript parses as ES modules
        run: |
          for f in $(find assets/js -name '*.js'); do
            node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }
          done
