<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grupo de Inteligencia Artificial · Universidad de La Habana</title>

  <meta name="theme-color" content="#D6D2C8">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/BigShouldersDisplay.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/Archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <script type="module" src="/assets/js/home.js"></script>

<body>
  <header id="site-header"></header>
  <main id="main">
    <section class="wrap hero">
      <div>
        <div class="poster" aria-hidden="true"><div class="sun"></div><div class="letters">GIA</div><div class="letters">GIA</div></div>
        <h1 data-i18n="site.name">Grupo de Inteligencia Artificial</h1>
        <p class="lede" data-i18n="home.lede"></p>
        <p class="credits" id="credits"></p>
      </div>
      <figure class="stage">
        <canvas aria-hidden="true"></canvas>
        <figcaption class="stage-caption">
          <span class="motif-name"></span>
          <span class="motif-picker"></span>
          <span class="motif-how"></span>
          <span class="motif-stat" aria-live="off"></span>
        </figcaption>
      </figure>
    </section>

    <section class="wrap section" aria-labelledby="lines-h">
      <div class="section-head"><h2 id="lines-h" data-i18n="home.lines"></h2></div>
      <div class="lines">
        <div class="line" data-line="language"><h3 data-i18n="line.language"></h3><p data-i18n="line.language.text"></p></div>

        <div class="line" data-line="search"><h3 data-i18n="line.search"></h3><p data-i18n="line.search.text"></p></div>
        <div class="line" data-line="agents"><h3 data-i18n="line.agents"></h3><p data-i18n="line.agents.text"></p></div>
      </div>
    </section>

    <section class="wrap section" aria-labelledby="featured-h">
      <div class="section-head"><h2 id="featured-h" data-i18n="home.featured"></h2><a class="more" href="/projects/" data-i18n="home.all.projects"></a></div>
      <div class="featured" id="featured"></div>
    </section>

    <section class="wrap section" aria-labelledby="latest-h">
      <div class="section-head"><h2 id="latest-h" data-i18n="home.latest"></h2><a class="more" href="/publications/" data-i18n="home.all.publications"></a></div>
      <ul class="papers" id="latest"></ul>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <noscript><p>Este sitio necesita JavaScript para mostrar sus listas. El código y los datos están en <a href="https://github.com/gia-uh/gia-uh.github.io">github.com/gia-uh/gia-uh.github.io</a>.</p></noscript>
